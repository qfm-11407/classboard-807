<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>平板作答｜單字擂台</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body data-page="play"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">字</span><span>單字擂台<small>WORD ARENA</small></span></a><span id="connection" class="connection">尚未加入</span></header><main class="play-main"><section id="join-panel" class="card join-panel"><span class="kicker">YOUR TURN TO WRITE</span><h1>準備落筆。</h1><p class="muted">加入房間，在平板寫下你的答案。</p><form id="join-form"><label>房號<input id="join-code" maxlength="6" placeholder="六位房號" required autocapitalize="characters" autocomplete="off"></label><div class="form-row"><label>學號<input id="join-student-id" type="text" maxlength="20" placeholder="例如 1150101" autocomplete="off" required></label><label>暱稱（選填）<input id="join-name" maxlength="12" placeholder="你的名字"></label></div><button class="button primary wide" type="submit">加入比賽 →</button></form><p id="join-error" class="form-error" role="alert"></p></section><div id="writing-panel" hidden><div id="play-practice" class="notice amber" hidden>流程演練中・不辨識實際筆跡</div><div class="play-meta"><span id="player-identity" class="pill neutral"></span><span id="play-room" class="tiny-label"></span></div><section class="play-question"><div class="question-overline"><span id="play-round" class="kicker">等待出題</span><span id="play-countdown" class="timer-badge">—</span></div><h1 id="play-prompt">好好握筆，準備上場。</h1></section><div class="writing-card"><div class="writing-instruction"><span>請在格內寫 <b>一個字</b></span><span id="write-state">等待教師開始</span></div><div class="canvas-wrap"><canvas id="handwriting" width="512" height="512" aria-label="單字手寫作答區"></canvas><span id="canvas-hint" class="canvas-hint">在這裡寫字</span><div id="canvas-lock" class="canvas-lock" hidden><span id="lock-symbol">✓</span><strong id="lock-message">已交卷</strong><small id="lock-detail">答案已鎖定，等待統一揭曉。</small></div></div><div class="drawing-toolbar"><button id="undo" class="tool-button" type="button">↶ 復原</button><button id="eraser" class="tool-button" type="button" aria-pressed="false">▱ 橡皮擦</button><button id="clear" class="tool-button" type="button">清除</button><span class="pen-description">黑筆・單字</span></div></div><button id="submit-button" class="button primary wide submit-button" disabled>送出答案 →</button><p id="play-message" class="play-message" role="status">請在倒數結束前送出，送出後無法修改。</p><div id="own-result" class="own-result" hidden></div></div></main><div id="toast" class="toast" role="status" hidden></div></body></html>
