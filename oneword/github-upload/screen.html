<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大螢幕｜單字擂台</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head><body data-page="screen" class="screen-body"><header class="screen-header"><a class="brand" href="./index.html"><span class="brand-mark">字</span><span>單字擂台<small>WORD ARENA</small></span></a><div class="screen-header-right"><span id="screen-mode" class="pill dark">LIVE CLASSROOM</span><span id="connection" class="connection">連線中</span><button id="fullscreen-button" class="icon-button" aria-label="切換全螢幕">⛶</button></div></header><main class="screen-main"><div id="screen-practice" class="notice amber" hidden>流程演練・對錯為預設測試結果，不代表筆跡辨識</div><section class="screen-question"><div class="screen-question-copy"><div class="screen-eyebrow"><span id="screen-round">等待參賽者加入</span><span id="screen-phase">準備開始</span></div><h1 id="screen-prompt">每一筆，都是你的實力。</h1><p id="screen-subtitle">請在平板開啟作答頁，輸入房號加入。</p></div><div class="screen-timer"><strong id="screen-countdown">—</strong><span id="screen-timer-label">準備落筆</span></div></section><section class="screen-room-line"><div>房號 <b id="screen-room">—</b><span id="screen-title"></span></div><div><span id="screen-progress">0 人已加入</span><button id="ranking-toggle" class="text-button light">查看排行榜 ↗</button></div></section><div id="screen-grid" class="answer-grid"><div class="screen-empty"><span>筆</span><h2>擂台已準備就緒</h2><p>參賽者加入後，會依學號出現在這裡。</p></div></div><div id="screen-ranking" class="screen-ranking" hidden></div></main><footer class="screen-footer"><span>一人一字，全班上場。</span><span id="screen-footer-hint">作答期間不公開筆跡與結果</span></footer><dialog id="image-dialog" class="image-dialog"><button class="icon-button dialog-close" aria-label="關閉">×</button><img id="enlarged-image" alt="放大的手寫答案"><p id="enlarged-label"></p></dialog><div id="toast" class="toast" role="status" hidden></div></body></html>
