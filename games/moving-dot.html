<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>追光點點｜互動遊戲室</title>
  <link rel="stylesheet" href="games.css?v=interaction-1">
  <link rel="stylesheet" href="game-rankings.css?v=1">
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js" defer></script>
  <script src="game-rankings-cloud.js?v=1" defer></script>
  <script src="game-rankings.js?v=cloud-2" defer></script>
  <script src="moving-dot.js?v=speed-2" defer></script>
</head>
<body class="game-page">
  <main id="game" class="game-shell">
    <header class="game-header">
      <div class="game-heading"><a class="back-link" href="./">← 遊戲室</a><h1>追光點點 <span>反應力挑戰</span></h1></div>
      <div class="toolbar"><button id="pause" class="quiet-button" disabled>暫停</button><button id="fullscreen" class="quiet-button">全螢幕</button></div>
    </header>
    <section class="scoreboard" aria-label="遊戲狀態">
      <div><span>點中次數</span><strong id="score">0</strong></div>
      <div><span>剩餘時間</span><strong><span id="time">60</span><small> 秒</small></strong></div>
      <div><span>挑戰等級</span><strong id="level">01</strong></div>
      <button type="button" id="open-score-rank" class="score-rank-trigger" aria-label="今日最佳，查看前十名排行榜"><span>今日最佳 <small>排行 ›</small></span><strong id="best">—</strong></button>
    </section>
    <section id="arena" class="arena" aria-label="圓點遊戲區">
      <div class="arena-label" aria-hidden="true">FOLLOW THE LIGHT</div>
      <button id="dot" class="dot" aria-label="點擊移動圓點" hidden><span class="dot-core"></span></button>
      <div id="overlay" class="overlay">
        <div class="dialog">
          <div id="dialog-tag" class="eyebrow">READY TO PLAY?</div>
          <h2 id="dialog-title">追上那顆光點。</h2>
          <p id="dialog-description">圓點會隨機出現、移動，幾秒後消失。<br>點中它，下一顆就會更快、更小！</p>
          <div id="results" class="results" hidden></div>
          <fieldset id="duration-options" class="duration-options"><legend>選擇回合時間</legend><label><input type="radio" name="duration" value="30"><span>30 秒</span></label><label><input type="radio" name="duration" value="60" checked><span>60 秒</span></label><label><input type="radio" name="duration" value="90"><span>90 秒</span></label></fieldset>
          <button id="start" class="primary-button">開始挑戰 <span aria-hidden="true">↗</span></button>
          <button id="restart" class="text-button" hidden>重新開始</button>
          <p class="dialog-note" id="dialog-note">用手指或滑鼠點擊圓點 · 點空白不扣分</p>
        </div>
      </div>
      <div id="feedback" class="feedback" aria-hidden="true"></div>
    </section>
    <footer class="game-footer"><span><i></i> 點中就換下一顆，越點越有挑戰</span><span id="misses">逾時 0 次</span></footer>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
