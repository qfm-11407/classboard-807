<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>泡泡連線｜互動遊戲室</title>
  <link rel="stylesheet" href="games.css?v=puzzles-1">
  <link rel="stylesheet" href="game-rankings.css?v=1">
  <link rel="stylesheet" href="puzzle-games.css?v=6">
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js" defer></script>
  <script src="game-rankings-cloud.js?v=1" defer></script>
  <script src="game-rankings.js?v=cloud-3" defer></script>
  <script src="puzzle-rules.js?v=5" defer></script>
  <script src="puzzle-games.js?v=6" defer></script>
</head>
<body class="game-page puzzle-page" data-game="bubble-connect" style="--lime:#ffadcc">
  <main id="game" class="game-shell">
    <header class="game-header">
      <div class="game-heading"><a class="back-link" href="./">← 遊戲室</a><h1><span id="title" style="font:inherit;color:inherit;margin:0">泡泡連線</span> <span id="subtitle">路線規劃</span></h1></div>
      <div class="toolbar"><button type="button" id="reset-board" class="quiet-button" hidden>重置此關</button><button type="button" id="pause" class="quiet-button" disabled>暫停</button><button type="button" id="fullscreen" class="quiet-button">全螢幕</button></div>
    </header>
    <section class="scoreboard" aria-label="遊戲狀態">
      <div><span id="progress-label">完成題數</span><strong id="progress">0 / 3</strong></div>
      <div><span id="time-label">使用時間</span><strong><span id="time">0</span><small> 秒</small></strong></div>
      <div><span>操作紀錄</span><strong id="details" class="puzzle-details">準備開始</strong></div>
      <button type="button" id="open-score-rank" class="score-rank-trigger" aria-label="經典連線今日最佳，查看前十名排行榜"><span>經典最佳 <small>排行 ›</small></span><strong id="best">—</strong></button>
    </section>
    <section class="puzzle-stage" aria-label="泡泡連線遊戲區">
      <p id="stage-note" class="stage-note"></p>
      <div id="play-area" class="play-area" inert></div>
      <div id="overlay" class="overlay">
        <div class="dialog">
          <div id="dialog-tag" class="eyebrow">PLAY · THINK · DISCOVER</div>
          <h2 id="dialog-title">泡泡連線</h2>
          <p id="dialog-description"></p>
          <div id="results" class="results" hidden></div>
          <fieldset id="puzzle-mode-options" class="duration-options puzzle-mode-options" aria-describedby="puzzle-mode-note">
            <legend>選擇玩法</legend>
            <label><input type="radio" name="puzzle-mode" value="classic" checked><span>經典連線</span></label>
            <label><input type="radio" name="puzzle-mode" value="remix"><span>迴路挑戰</span></label>
            <label><input type="radio" name="puzzle-mode" value="coop"><span>雙人合作</span></label>
          </fieldset>
          <p id="puzzle-mode-note" class="dialog-note"></p>
          <fieldset id="difficulty-options" class="duration-options difficulty-options"><legend>選擇難度</legend><label><input type="radio" name="difficulty" value="1" checked><span>簡易<small aria-hidden="true">5×5 · 4 組泡泡</small></span></label><label><input type="radio" name="difficulty" value="2"><span>正常<small aria-hidden="true">6×6 · 5 組泡泡</small></span></label><label><input type="radio" name="difficulty" value="3"><span>挑戰<small aria-hidden="true">7×7 · 6 組泡泡</small></span></label></fieldset>
          <button type="button" id="start" class="primary-button">開始挑戰 ↗</button>
          <button type="button" id="restart" class="text-button" hidden>重新開始</button>
        </div>
      </div>
    </section>
    <footer class="game-footer"><span id="help"></span><span>觸控 · 滑鼠 · 鍵盤</span></footer>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
