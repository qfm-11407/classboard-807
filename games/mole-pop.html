<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>地鼠出沒｜互動遊戲室</title>
  <link rel="stylesheet" href="games.css?v=mole-1">
  <link rel="stylesheet" href="mole-pop.css?v=mole-1">
  <script src="mole-pop.js?v=mole-1" defer></script>
</head>
<body class="game-page mole-page">
  <main id="game" class="game-shell">
    <header class="game-header">
      <div class="game-heading"><a class="back-link" href="./">← 遊戲室</a><h1>地鼠出沒 <span>6 × 5 · 三十個洞口</span></h1></div>
      <div class="toolbar"><button id="pause" class="quiet-button" disabled>暫停</button><button id="fullscreen" class="quiet-button">全螢幕</button></div>
    </header>
    <section class="scoreboard" aria-label="遊戲狀態">
      <div><span>點中次數</span><strong id="score">0</strong></div>
      <div><span>剩餘時間</span><strong><span id="time">60</span><small> 秒</small></strong></div>
      <div><span>挑戰等級</span><strong id="level">01</strong></div>
      <div><span>最佳紀錄</span><strong id="best">0</strong></div>
    </section>
    <section id="arena" class="arena mole-arena" aria-label="打地鼠遊戲區，6 欄 5 列，共 30 個洞口">
      <div class="field-caption" aria-hidden="true"><span>THE LITTLE BURROW</span><span>6 × 5</span></div>
      <div id="field" class="mole-field" role="group" aria-label="30 個地鼠洞口" inert></div>
      <div id="overlay" class="overlay">
        <div class="dialog">
          <div id="dialog-tag" class="eyebrow">THIRTY HOLES · ONE CHALLENGE</div>
          <h2 id="dialog-title">小地鼠，躲哪裡？</h2>
          <p id="dialog-description">6 欄 × 5 列，30 個洞口。<br>看見地鼠就點一下，趁牠縮回去前得分！</p>
          <div id="results" class="results" hidden></div>
          <fieldset id="duration-options" class="duration-options"><legend>選擇回合時間</legend><label><input type="radio" name="duration" value="30"><span>30 秒</span></label><label><input type="radio" name="duration" value="60" checked><span>60 秒</span></label><label><input type="radio" name="duration" value="90"><span>90 秒</span></label></fieldset>
          <button id="start" class="primary-button">開始挑戰 <span aria-hidden="true">↗</span></button>
          <button id="restart" class="text-button" hidden>重新開始</button>
          <p id="dialog-note" class="dialog-note">支援觸控與滑鼠 · 點空洞不扣分</p>
        </div>
      </div>
      <div id="feedback" class="feedback" aria-hidden="true"></div>
    </section>
    <footer class="game-footer"><span><i></i> 看見地鼠就點一下，越玩越快！</span><span id="misses">漏掉 0 隻</span></footer>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
