name: 更新校園溫度
on:
  workflow_dispatch:
# Hosted Linux and Windows currently time out connecting to the source's 8443 port.
# Do not schedule repeated failures. Enable only after connectivity is resolved:
#  schedule:
#    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: campus-temperature
  cancel-in-progress: false
jobs:
  temperature:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: 擷取公開看板溫度（建立工作階段及重新載入）
        id: capture
        continue-on-error: true
        run: node scripts/fetch-campus-temperature.mjs "$RUNNER_TEMP/campus-temperature.json"
      - name: 發布獨立溫度資料，不修改主程式或 Firebase
        run: node scripts/publish-campus-temperature.mjs "$RUNNER_TEMP/campus-temperature.json"
      - name: 回報擷取失敗
        if: steps.capture.outcome == 'failure'
        run: |
          echo '本次未取得有效溫度，首頁將標示暫無資料。'
          exit 1
