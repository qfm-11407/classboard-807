<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123b2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="appslogo.png">
  <link rel="apple-touch-icon" href="appslogo.png">
  <script src="pwa-init.js"></script>
  <title>807 聯絡簿繳交登記</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="firebase-classroom.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:'Noto Sans TC',sans-serif;color:#fff;background:radial-gradient(circle at 14% 6%,#778647 0,transparent 36%),radial-gradient(circle at 85% 90%,#805d43 0,transparent 38%),#123b2c}.page{max-width:1750px;margin:auto;padding:36px}.glass{background:#ffffff14;border:1px solid #ffffff2b;box-shadow:inset 0 1px #ffffff24,0 14px 30px #0004;backdrop-filter:blur(20px)}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{margin:2px 0 0;font-size:2rem;letter-spacing:.12em}h2{margin:0;font-size:1.65rem}.eyebrow{margin:0;color:#ffffffaa;font-weight:700;letter-spacing:.15em}.back,.nav-button{border:0;color:#fff;font:inherit;font-weight:700;cursor:pointer}.back{padding:12px 20px;border-radius:16px;text-decoration:none}.layout{display:grid;grid-template-columns:minmax(460px,.9fr) minmax(0,1.1fr);gap:24px}.panel{border-radius:30px;padding:28px}.calendar-head,.status-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.nav-button{padding:9px 17px;border-radius:12px;background:#ffffff14;font-size:1.2rem}.today-button{border:0;background:none;color:#f6d365;font:inherit;font-weight:700;cursor:pointer;margin-top:4px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.weekdays{color:#ffffff99;text-align:center;font-size:.85rem;margin-bottom:8px}.calendar{background:#ffffff12;border-radius:10px;overflow:hidden}.blank{min-height:72px}.calendar-cell{min-height:72px;border:0;background:#00000012;color:#fff;padding:8px;text-align:left;cursor:pointer;transition:.15s}.calendar-cell:hover{background:#ffffff19}.date{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-weight:800}.today .date{background:#f6d365;color:#202020}.selected{outline:2px solid #8fd3f4;background:#8fd3f426}.dot{width:7px;height:7px;border-radius:50%;background:#86efac;margin-top:5px}.status{color:#86efac;font-weight:700}.message{min-height:1.5em;color:#ffffffaa}.students{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}.student{aspect-ratio:1;border-radius:16px;border:2px solid #ffffff25;background:#0002;color:#fff;padding:10px;text-align:left;font:inherit;font-weight:800;overflow:hidden;cursor:pointer;transition:.2s}.student:hover:not(:disabled){border-color:#ffffff80}.student:disabled{cursor:default}.student.done{background:#1d6e4eaa;border-color:#86efac}.student small,.student span{display:block}.student small{opacity:.72}.student span{font-size:1.12rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:1000px){.layout{grid-template-columns:1fr}.students{grid-template-columns:repeat(6,1fr)}}@media(max-width:620px){.page{padding:18px}.panel{padding:18px}.students{grid-template-columns:repeat(4,1fr)}h1{font-size:1.45rem}.blank,.calendar-cell{min-height:55px}}
  </style>
</head>
<body>
  <div class="page">
    <header><div><p class="eyebrow">高雄市立前峰國中 807</p><h1>聯絡簿繳交登記</h1></div><a class="back glass" href="board.html">返回班級看板</a></header>
    <main class="layout">
      <section class="panel glass"><div class="calendar-head"><button class="nav-button" id="prev" aria-label="上個月">‹</button><div style="text-align:center"><h2 id="month-title"></h2><button class="today-button" id="go-today">回到今天</button></div><button class="nav-button" id="next" aria-label="下個月">›</button></div><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar" class="calendar"></div></section>
      <section class="panel glass"><div class="status-head"><div><p class="eyebrow" style="color:#f6d365">NOTEBOOK CHECK-IN</p><h2 id="selected-title"></h2></div><p id="stat" class="status"></p></div><p id="message" class="message"></p><div id="students" class="students"></div></section>
    </main>
  </div>
  <script>
    const $=id=>document.getElementById(id), key=date=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(date), todayKey=key(new Date());
    let cursor=new Date(), selected=todayKey, roster=[], checkins={};
    const read=value=>{try{return JSON.parse(value)}catch(_){return null}};
    const parseDate=value=>new Date(`${value}T00:00:00`);
    const format=(value,options)=>parseDate(value).toLocaleDateString('zh-TW',options);
    const time=value=>new Date(value).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const monthKey=()=>`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;
    function renderCalendar(){const year=cursor.getFullYear(),month=cursor.getMonth(),first=new Date(year,month,1),total=new Date(year,month+1,0).getDate(),box=$('calendar');$('month-title').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long'}).format(first);box.innerHTML='';for(let index=0;index<first.getDay();index++){const blank=document.createElement('div');blank.className='blank';box.append(blank)}for(let day=1;day<=total;day++){const value=key(new Date(year,month,day)),cell=document.createElement('button');cell.className=`calendar-cell ${value===todayKey?'today ':''}${value===selected?'selected':''}`;cell.innerHTML=`<span class="date">${day}</span>${checkins[value]&&Object.keys(checkins[value]).length?'<span class="dot"></span>':''}`;cell.onclick=()=>{selected=value;renderCalendar();renderStudents()};box.append(cell)}}
    function renderStudents(){const records=checkins[selected]||{},done=Object.keys(records).length;$('selected-title').textContent=`${format(selected,{month:'long',day:'numeric',weekday:'long'})} 繳交狀況`;$('stat').textContent=`已交 ${done}/${roster.length}`;$('students').innerHTML='';roster.forEach(student=>{const stamp=records[student.seat],button=document.createElement('button');button.className=`student ${stamp?'done':''}`;button.disabled=Boolean(stamp)||selected!==todayKey;button.innerHTML=`<small>${String(student.seat).padStart(2,'0')} 號</small><span>${student.name}</span><small style="margin-top:8px">${stamp?`繳交 ${time(stamp)}`:(selected===todayKey?'點選繳交':'尚未繳交')}</small>`;button.onclick=()=>checkin(student.seat);$('students').append(button)});$('message').textContent=selected===todayKey?'每位學生今日僅能登記一次。':'這是歷史查詢日期，僅供查看。'}
    async function loadMonth(){checkins=await FirebaseClassroom.getNotebookMonth(monthKey());renderCalendar();renderStudents()}
    async function checkin(seat){$('message').textContent='登記中…';try{const result=await FirebaseClassroom.addNotebookCheckin({seat,date:selected});if(!checkins[selected])checkins[selected]={};checkins[selected][seat]=result.timestamp;$('message').textContent='已完成登記。';renderCalendar();renderStudents()}catch(error){$('message').textContent=error.message==='Already checked in'?'這位同學今天已完成登記。':'登記失敗，請再試一次。'}}
    async function start(){try{const state=await FirebaseClassroom.getState(),data=state.data||{};roster=(read(data.classroomStudentRoster)||[]).filter(student=>student&&student.name).sort((a,b)=>a.seat-b.seat);await loadMonth()}catch(_){$('message').textContent='Firebase 資料尚未完成設定。'}}
    $('prev').onclick=async()=>{cursor.setMonth(cursor.getMonth()-1);await loadMonth()};$('next').onclick=async()=>{cursor.setMonth(cursor.getMonth()+1);await loadMonth()};$('go-today').onclick=async()=>{cursor=new Date();selected=todayKey;await loadMonth()};start();
  </script>
</body>
</html>
