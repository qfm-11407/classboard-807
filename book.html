<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>807 聯絡簿繳交登記</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;font-family:'Noto Sans TC',sans-serif;color:#fff;background:radial-gradient(circle at 14% 6%,#778647 0,transparent 36%),radial-gradient(circle at 85% 90%,#805d43 0,transparent 38%),#123b2c}.glass{background:#ffffff14;border:1px solid #ffffff2b;box-shadow:inset 0 1px #ffffff24,0 14px 30px #0004;backdrop-filter:blur(20px)}.calendar-cell{min-height:72px;border:1px solid #ffffff16;padding:8px;text-align:left;border-radius:8px;transition:.15s}.calendar-cell:hover{background:#ffffff19}.calendar-cell.today .date{background:#f6d365;color:#202020}.calendar-cell.selected{outline:2px solid #8fd3f4;background:#8fd3f426}.date{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:#86efac;margin-top:5px}.student{aspect-ratio:1;border-radius:16px;border:2px solid #ffffff25;background:#0002;padding:10px;text-align:left;font-weight:800;transition:.2s;overflow:hidden}.student:hover:not(:disabled){border-color:#ffffff80}.student.done{background:#1d6e4eaa;border-color:#86efac;color:#fff}</style></head>
<body class="p-5 lg:p-9"><header class="max-w-[1750px] mx-auto flex items-center justify-between mb-6"><div><p class="text-white/65 font-bold tracking-widest">高雄市立前峰國中 807</p><h1 class="text-4xl font-black tracking-widest">聯絡簿繳交登記</h1></div><a href="board.html" class="glass rounded-2xl px-5 py-3 font-bold">回班級看板</a></header><main class="max-w-[1750px] mx-auto grid grid-cols-1 xl:grid-cols-[minmax(520px,.9fr)_minmax(0,1.1fr)] gap-6"><section class="glass rounded-[2rem] p-5 lg:p-7"><div class="flex items-center justify-between mb-5"><button id="prev" class="glass rounded-xl px-4 py-2 text-xl" aria-label="上個月">‹</button><div class="text-center"><h2 id="month-title" class="text-3xl font-black"></h2><button id="go-today" class="mt-1 text-sm text-[#f6d365] font-bold">回到今天</button></div><button id="next" class="glass rounded-xl px-4 py-2 text-xl" aria-label="下個月">›</button></div><div class="grid grid-cols-7 text-center text-white/55 text-sm mb-2"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar" class="grid grid-cols-7 gap-px bg-white/10 rounded-lg overflow-hidden"></div></section><section class="glass rounded-[2rem] p-6 lg:p-8"><div class="flex flex-wrap justify-between items-end gap-3 mb-6"><div><p class="text-[#f6d365] font-bold">NOTEBOOK CHECK-IN</p><h2 id="selected-title" class="text-3xl font-black mt-1"></h2></div><p id="stat" class="text-[#86efac] font-bold"></p></div><p id="message" class="text-white/65 mb-4"></p><div id="students" class="grid grid-cols-4 sm:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-3"></div></section></main><script>
const $=id=>document.getElementById(id),key=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(d),todayKey=key(new Date());let cursor=new Date(),selected=todayKey,roster=[],checkins={};const read=v=>{try{return JSON.parse(v)}catch{return null}};function parseDate(v){return new Date(v+'T00:00:00')}function format(v,opts){return parseDate(v).toLocaleDateString('zh-TW',opts)}function time(v){return new Date(v).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}
function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),total=new Date(y,m+1,0).getDate(),box=$('calendar');$('month-title').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long'}).format(first);box.innerHTML='';for(let i=0;i<first.getDay();i++)box.append(document.createElement('div'));for(let d=1;d<=total;d++){const value=key(new Date(y,m,d)),cell=document.createElement('button');cell.className='calendar-cell '+(value===todayKey?'today ':'')+(value===selected?'selected':'');cell.innerHTML=`<span class="date">${d}</span>${checkins[value]&&Object.keys(checkins[value]).length?'<span class="dot"></span>':''}`;cell.onclick=()=>{selected=value;renderCalendar();renderStudents()};box.append(cell)}}
function renderStudents(){const records=checkins[selected]||{},done=Object.keys(records).length;$('selected-title').textContent=format(selected,{month:'long',day:'numeric',weekday:'long'})+' 繳交狀況';$('stat').textContent=`已交 ${done}/${roster.length}`;$('students').innerHTML='';roster.forEach(s=>{const stamp=records[s.seat],b=document.createElement('button');b.className='student '+(stamp?'done':'');b.disabled=Boolean(stamp)||selected!==todayKey;b.innerHTML=`<small class="block opacity-65">${String(s.seat).padStart(2,'0')} 號</small><span class="block text-xl mt-1 truncate">${s.name}</span><small class="block mt-2 opacity-80">${stamp?'繳交 '+time(stamp):(selected===todayKey?'點選繳交':'尚未繳交')}</small>`;b.onclick=()=>checkin(s.seat);$('students').append(b)});$('message').textContent=selected===todayKey?'每位學生今日僅能登記一次。':'這是歷史查詢日期，僅供查看。'}
async function checkin(seat){$('message').textContent='登記中…';try{const r=await fetch('/api/classroom?action=notebook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seat,date:selected})}),p=await r.json();if(!r.ok)throw new Error(p.error);if(!checkins[selected])checkins[selected]={};checkins[selected][seat]=p.timestamp;$('message').textContent='已完成登記。';renderCalendar();renderStudents()}catch(e){$('message').textContent=e.message==='Already checked in'?'這位同學今天已完成登記。':'登記失敗，請再試一次。'}}
async function load(){try{const p=await (await fetch('/api/classroom',{cache:'no-store'})).json(),d=p.data||{};roster=(read(d.classroomStudentRoster)||[]).filter(s=>s&&s.name).sort((a,b)=>a.seat-b.seat);checkins=read(d.notebookCheckins)||{};renderCalendar();renderStudents()}catch{$('message').textContent='尚未連接雲端資料，請部署到 Netlify 後使用。'}}
$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);renderCalendar()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);renderCalendar()};$('go-today').onclick=()=>{cursor=new Date();selected=todayKey;renderCalendar();renderStudents()};load();
</script><script src="cloud-config.js"></script><script src="book-cloudflare.js"></script></body></html>
